name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Pinned to a minor, not the open "~> v2" range: GoReleaser ships
          # deprecations that later become removals, so a new v2 minor can
          # break a release with no warning. Bump this deliberately after
          # running `make release-check` against the new version locally.
          version: "~> v2.15"
          args: release --clean --release-notes release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          # Release the tag that triggered this run, not whatever `git describe`
          # picks. RELEASING.md has you cut vX.Y.Z-rc.N and then vX.Y.Z with no
          # commits between them, so both tags land on one commit and describe
          # resolves ambiguously — on v1.3.0 it chose the rc, rebuilt rc.1
          # artifacts, and failed uploading them over the rc release's own
          # assets (422 already_exists). This also keeps the before-hook's
          # extract-release-notes {{ .Tag }} on the right CHANGELOG section.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
